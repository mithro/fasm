# The fasm Python package, with its parser implemented in Rust (the
# fasm._fasm_rs extension module, crate rust/fasm-python), built with
# maturin:
#
#     pip install .                      # or: pip wheel .
#     maturin develop --release          # editable install into a venv
#
# The pure Python package lives in fasm/ ("python-source" below); the
# extension module is placed next to it as fasm/_fasm_rs.*.so. setup.py is
# the legacy setuptools + CMake + ANTLR build and is no longer used.
# See docs/rewrite/DESIGN-python.md.

[build-system]
# maturin >= 1.9.4 sets PYO3_BUILD_EXTENSION_MODULE, which replaces pyo3's
# deprecated `extension-module` feature (see rust/fasm-python/Cargo.toml).
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "fasm"
# Pre-release version of the eventual 0.1.0, kept in step by hand with the
# Cargo workspace's `0.1.0-dev` (PEP 440's spelling of the same semver
# pre-release; see [workspace.package] in the root Cargo.toml and
# docs/RELEASING.md for the release process and where every
# version string lives). The legacy setup.py build derived this from `git
# describe` (update_version.py, generating fasm/version.py); that build is
# gone (docs/rewrite/DESIGN-python.md), so it is static and bumped by hand
# at release time instead.
version = "0.1.0.dev0"
description = "FPGA Assembly (FASM) Parser and Generation library"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "F4PGA Authors", email = "f4pga-wg@lists.chipsalliance.org" },
]
requires-python = ">=3.9"
dependencies = ["textx"]
keywords = ["fasm", "fpga", "xilinx", "bitstream", "eda"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Compilers",
    "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Homepage = "https://github.com/chipsalliance/fasm"

[project.scripts]
fasm = "fasm.tool:main"

[project.optional-dependencies]
# Everything needed to build, test and lint the Python package from a
# checkout: `pip install .[dev]` (see tests/README.md, tox.ini,
# .github/workflows/python.yml).
dev = [
    "maturin>=1.9.4,<2",
    "textx",
    "pytest",
    "flake8",
    "yapf==0.24.0",
]

# The extension includes the fasm.xilinx bindings (the `xilinx` cargo
# feature of rust/fasm-python, on by default); `maturin build
# --no-default-features` builds the parser-only module.
[tool.maturin]
manifest-path = "rust/fasm-python/Cargo.toml"
python-source = "."
module-name = "fasm._fasm_rs"
bindings = "pyo3"
strip = true
exclude = ["fasm/version.py", "fasm/**/__pycache__/**"]
