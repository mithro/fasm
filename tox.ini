[tox]
envlist = py{39,310,311,312,313}

[testenv]
description = Build the fasm wheel (maturin, via the pyproject.toml build
    backend) and run the Python test suite against the installed package,
    the same way tests/README.md documents for a wheel/sdist install.
package = wheel
deps =
    pytest
    textx
change_dir = {envtmpdir}
commands =
    pytest --import-mode=importlib \
        {toxinidir}/tests/test_simple.py {toxinidir}/tests/test_rust_parser.py \
        {toxinidir}/tests/test_xilinx_python.py

[testenv:lint]
description = flake8 + yapf --diff over the Python sources.
package = skip
deps =
    flake8
    yapf==0.24.0
commands =
    flake8 fasm tests
    yapf --diff --recursive fasm tests
