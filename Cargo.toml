# Cargo workspace for the Rust rewrite of the FASM assembler.
#
# See docs/rewrite/PLAN.md for the target architecture of each crate.

[workspace]
resolver = "2"
members = [
    "rust/fasm",
    "rust/fasm-cli",
    "rust/fasm-xilinx",
    "rust/fasm-capi",
    "rust/fasm-python",
]
# Built by a bare `cargo build` / `cargo test` (without `--workspace`):
# everything except rust/fasm-python, whose pyo3 build script needs a
# Python >= 3.9 interpreter and its shared library. CI and the
# verification commands in docs/rewrite/ use `--workspace`, which builds
# fasm-python too (docs/rewrite/DESIGN-python.md).
default-members = [
    "rust/fasm",
    "rust/fasm-cli",
    "rust/fasm-xilinx",
    "rust/fasm-capi",
]
# rust/fasm/fuzz (T1.6) is a standalone cargo-fuzz crate (it declares its own
# empty `[workspace]`, see its Cargo.toml) that requires nightly; excluded
# here too so it is never implicitly picked up by a `cargo build`/`test`
# run in this workspace, which targets stable (MSRV 1.88, see
# `workspace.package.rust-version` below).
exclude = ["rust/fasm/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/chipsalliance/fasm"
authors = ["The F4PGA Authors"]
# Minimum supported Rust version, verified in CI (.github/workflows/rust.yml,
# the `msrv` job): `rust/fasm/src/idstring/interner.rs` uses
# `<[u8]>::as_chunks`, stabilized in 1.88.0 (the workspace failed to build
# on 1.87.0 and below when this was checked).
rust-version = "1.88"

# Dependencies shared by two or more workspace crates are declared here and
# pulled in by member crates with `workspace = true`.
[workspace.dependencies]
# JSON reading (tilegrid.json, part.json) in fasm-xilinx; also a dev
# dependency of fasm (oracle parse trees).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Content hashes of the source files and integrity hashes of the
# fasm-xilinx binary database cache (T5.3, docs/rewrite/DESIGN-xilinx-db.md
# §8.8, which gives the reasons for this choice).
blake3 = "1.8"

[workspace.lints.clippy]
all = "warn"
pedantic = "allow"
