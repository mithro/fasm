[package]
name = "fasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core library for the FASM (FPGA Assembly) file format: idstring interning, data model, parser and output/merge support."

[lib]
name = "fasm"
path = "src/lib.rs"

[dependencies]
# Hash index of the idstring interner tables (HashTable storing only u32
# entry numbers) and its hasher; see docs/rewrite/DESIGN-idstring.md.
foldhash = "0.2"
hashbrown = { version = "0.17", default-features = false, features = ["inline-more"] }

[lints]
workspace = true
