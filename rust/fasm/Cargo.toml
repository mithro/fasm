[package]
name = "fasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Core library for the FASM (FPGA Assembly) file format: idstring interning, data model, parser and output/merge support."
readme = "README.md"
keywords = ["fasm", "fpga", "parser", "bitstream", "eda"]
categories = ["parser-implementations", "hardware-support"]
# Keep the published crate to source + license + readme: no benches/
# fixtures, no fuzz/ (its own cargo-fuzz workspace, T1.6), no dev-only
# example inputs. `cargo package -p fasm --list` verifies this.
include = ["src/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[lib]
name = "fasm"
path = "src/lib.rs"

[dependencies]
# Hasher of the idstring interner tables (fast on short keys, no
# dependencies); see docs/rewrite/DESIGN-idstring.md.
foldhash = "0.2"

[dev-dependencies]
num-bigint = "0.4"
# Reads the oracle parse trees (tests/corpus/oracle/*.json) in the parser
# tests.
serde_json = "1"
proptest = { version = "1.11", default-features = false, features = ["std"] }

[[bench]]
name = "idstring"
harness = false

[[bench]]
name = "parser"
harness = false

[lints]
workspace = true
