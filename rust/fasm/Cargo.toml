[package]
name = "fasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Core library for the FASM (FPGA Assembly) file format: idstring interning, data model, parser and output/merge support."

[lib]
name = "fasm"
path = "src/lib.rs"

[dependencies]
# Hasher of the idstring interner tables (fast on short keys, no
# dependencies); see docs/rewrite/DESIGN-idstring.md.
foldhash = "0.2"

[dev-dependencies]
num-bigint = "0.4"
proptest = { version = "1.11", default-features = false, features = ["std"] }

[[bench]]
name = "idstring"
harness = false

[lints]
workspace = true
