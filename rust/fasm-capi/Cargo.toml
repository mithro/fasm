[package]
name = "fasm-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "C ABI (libfasm) for the fasm crate: header include/fasm/fasm.h generated with cbindgen, plus the header-only C++ wrapper include/fasm/fasm.hpp."

[lib]
# `fasm` is already taken by the core crate in this workspace, so the
# library is named `fasm_capi` (it still builds/installs as `libfasm`,
# see task T4.1).
name = "fasm_capi"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
fasm = { path = "../fasm" }

[lints]
workspace = true
