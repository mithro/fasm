[package]
name = "fasm-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "C ABI (libfasm_capi) for the fasm crate: header include/fasm/fasm.h generated with cbindgen, plus the header-only C++ wrapper include/fasm/fasm.hpp."

[lib]
# `fasm` is already taken by the core crate in this workspace, so the
# library is named `fasm_capi`: `libfasm_capi.so` / `.a` / `.dylib`,
# `fasm_capi.dll` (see docs/rewrite/DESIGN-capi.md).
name = "fasm_capi"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
fasm = { path = "../fasm" }
# The `fasm_xilinx_*` functions (src/xilinx/).
fasm-xilinx = { path = "../fasm-xilinx" }

[lints]
workspace = true
