# cbindgen configuration for include/fasm/fasm.h, the C header of the
# fasm-capi crate. Regenerate the header with `make capi-header` (see
# docs/rewrite/DESIGN-capi.md); `make capi-header-check` (and the
# `header_is_up_to_date` test) fail when the checked in header is stale.

language = "C"
include_guard = "FASM_FASM_H"
# Wraps the declarations in `#ifdef __cplusplus extern "C" { ... }`.
cpp_compat = true
documentation = true
documentation_style = "doxy"
# `typedef struct fasm_file fasm_file;` and `typedef enum fasm_status
# {...} fasm_status;`: usable both with and without the `struct` / `enum`
# keyword.
style = "both"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
line_length = 100
tab_width = 4
autogen_warning = """/*
 * Generated by cbindgen from rust/fasm-capi/src (configuration:
 * rust/fasm-capi/cbindgen.toml). Do not edit: regenerate with
 * `make capi-header`.
 *
 * Copyright 2017-2022 F4PGA Authors
 * SPDX-License-Identifier: Apache-2.0
 */"""
header = """/*
 * libfasm_capi: C API of the Rust FASM (FPGA Assembly) library.
 *
 * See docs/rewrite/DESIGN-capi.md for ownership, lifetime, error and
 * thread safety rules. In short:
 *  - objects returned by fasm_*_new, fasm_parse_*, *_to_string,
 *    fasm_set_feature_name_string and fasm_file_merge_and_sort* are owned
 *    by the caller and released with the matching fasm_*_free function;
 *  - pointers returned by accessors borrow from their parent object;
 *  - fallible functions report details through an optional
 *    `fasm_error **err` argument (free with fasm_error_free);
 *  - borrowed strings (fasm_str) are NOT NUL terminated, owned strings
 *    (fasm_string) are.
 */"""
after_includes = """
/*
 * FASM_API marks the exported functions. On Windows, define FASM_STATIC
 * when linking the static library; otherwise the functions are imported
 * from the DLL. Elsewhere it gives them default visibility.
 */
#ifndef FASM_API
#  if defined(_WIN32) || defined(__CYGWIN__)
#    if defined(FASM_STATIC)
#      define FASM_API
#    else
#      define FASM_API __declspec(dllimport)
#    endif
#  elif defined(__GNUC__) && __GNUC__ >= 4
#    define FASM_API __attribute__((visibility("default")))
#  else
#    define FASM_API
#  endif
#endif
"""

[fn]
prefix = "FASM_API"
args = "auto"
# Keep the source order (grouped by topic) rather than sorting by name.
sort_by = "None"

[enum]
# Variants already carry their C spelling (FASM_OK, FASM_VALUE_FORMAT_...).
rename_variants = "None"

[parse]
parse_deps = false

[export]
# Only the C API; the prefix is already part of every Rust name.
item_types = ["enums", "structs", "unions", "typedefs", "opaque", "functions", "constants"]
# Used through `int32_t` fields and arguments (so that an out of range value
# from C is an error, not undefined behaviour), not by name.
include = ["fasm_xilinx_bitstream_format"]
