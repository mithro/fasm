[package]
name = "fasm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Command line tools for FASM: the `fasm` binary (100% command line compatible with the original Python `fasm/tool.py`) and the Xilinx bitstream tools (`fasm2frames`, `xcfasm`, `xc7frames2bit`, `bitread`, and prjuray's `xcframes2bit` and `bitread` as `uray-bitread`) and the `fasm-db-cache` database cache tool."
readme = "README.md"
keywords = ["fasm", "fpga", "xilinx", "bitstream", "cli"]
categories = ["command-line-utilities", "hardware-support"]
# Ship only what builds the binaries; tools/ (developer scripts) and
# tests/ fixtures are not needed by `cargo install fasm-cli`.
include = ["src/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[lib]
name = "fasm_cli"
path = "src/lib.rs"

[[bin]]
name = "fasm"
path = "src/main.rs"

[[bin]]
name = "fasm2frames"
path = "src/bin/fasm2frames.rs"

[[bin]]
name = "xcfasm"
path = "src/bin/xcfasm.rs"

[[bin]]
name = "xc7frames2bit"
path = "src/bin/xc7frames2bit.rs"

[[bin]]
name = "bitread"
path = "src/bin/bitread.rs"

[[bin]]
name = "xcframes2bit"
path = "src/bin/xcframes2bit.rs"

[[bin]]
name = "uray-bitread"
path = "src/bin/uray-bitread.rs"

[[bin]]
name = "uray-fasm2frames"
path = "src/bin/uray-fasm2frames.rs"

[[bin]]
name = "fasm-db-cache"
path = "src/bin/fasm-db-cache.rs"

[dependencies]
fasm = { path = "../fasm", version = "0.1.0-dev" }
fasm-xilinx = { path = "../fasm-xilinx", version = "0.1.0-dev" }

# Hasher of CanonicalLines::index (fast on short keys, no dependencies);
# see docs/rewrite/DESIGN-idstring.md, docs/rewrite/BENCHMARKS.md
# "After T8.2b".
foldhash = "0.2"

# Only for the terminal width (`ioctl(TIOCGWINSZ)`), which argparse uses to
# wrap the help and usage messages.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
