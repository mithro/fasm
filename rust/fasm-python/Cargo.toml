[package]
name = "fasm-python"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "pyo3 extension module fasm._fasm_rs, built with maturin, exposing the fasm crate to the existing fasm Python package."
# Not a general purpose Rust library: it is maturin's build target for
# the `fasm` Python wheel (see pyproject.toml, docs/rewrite/DESIGN-python.md)
# and has no reason to exist as a standalone crates.io crate.
publish = false

[lib]
name = "_fasm_rs"
path = "src/lib.rs"
# `cdylib` is the extension module maturin packages; `rlib` lets
# `cargo test` build the (pure Rust) unit tests.
crate-type = ["cdylib", "rlib"]

[features]
# The `fasm._fasm_rs.xilinx` submodule behind the `fasm.xilinx` package
# (bindings for the fasm-xilinx crate, docs/rewrite/DESIGN-python.md). On
# by default; `--no-default-features` builds the parser-only module.
default = ["xilinx"]
xilinx = ["dep:fasm-xilinx"]

[dependencies]
fasm = { path = "../fasm" }
fasm-xilinx = { path = "../fasm-xilinx", optional = true }
# `abi3-py39`: one wheel (`cp39-abi3`) for every CPython >= 3.9, see
# docs/rewrite/DESIGN-python.md. The deprecated `extension-module` feature
# is not used: maturin (>= 1.9.4) sets `PYO3_BUILD_EXTENSION_MODULE` when it
# builds the wheel, and a plain `cargo build` / `cargo test` links
# libpython like any other pyo3 program.
pyo3 = { version = "0.29.2", features = ["abi3-py39"] }

[lints]
workspace = true
