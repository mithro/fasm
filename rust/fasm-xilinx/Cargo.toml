[package]
name = "fasm-xilinx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "prjxray/prjuray database loader, FASM -> frames assembler and frames -> bitstream writer for Xilinx Series7 / UltraScale / UltraScale+ parts."

[lib]
name = "fasm_xilinx"
path = "src/lib.rs"

[dependencies]
fasm = { path = "../fasm" }
# Hasher of the IdString keyed maps (same as the fasm interner).
foldhash = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "db"
harness = false

[lints]
workspace = true
